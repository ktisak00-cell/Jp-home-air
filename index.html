<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JP Home air">
<title>ระบบขายแอร์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@400;500;600&family=Noto+Sans+Lao:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar, one column up to 1100px. Frosted "cool air" surfaces, one accent (ice teal), periwinkle for purchases. */
:root{
  --bg:#edf4f5; --glow:rgba(15,157,140,.16);
  --surface:#ffffff; --surface2:#f2f8f9; --line:#d3e2e6;
  --fg:#0c2127; --muted:#58737b;
  --accent:#0e9a89; --accent-ink:#ffffff; --accent-soft:rgba(14,154,137,.12);
  --in:#5565d8; --in-soft:rgba(85,101,216,.13);
  --good:#0f9d63; --warn:#b97a06; --bad:#d23f55;
  --imgbg:#ffffff; --ph1:#dfeaee; --ph2:#b9ccd3; --ph3:#8fb0bb;
  --shadow:0 1px 2px rgba(12,33,39,.06),0 8px 24px rgba(12,33,39,.06);
  --f-d:'Kanit','IBM Plex Sans Thai','Noto Sans Lao',system-ui,sans-serif;
  --f-b:'IBM Plex Sans Thai','Noto Sans Lao','Kanit',system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081015; --glow:rgba(94,224,207,.10);
  --surface:#0f1b21; --surface2:#142830; --line:#213742;
  --fg:#e6f2f4; --muted:#8aa5ae;
  --accent:#5ee0cf; --accent-ink:#04211e; --accent-soft:rgba(94,224,207,.13);
  --in:#8fa0ff; --in-soft:rgba(143,160,255,.15);
  --good:#4fdc9a; --warn:#f2b84b; --bad:#ff7487;
  --imgbg:#f6fafb; --ph1:#dfeaee; --ph2:#b9ccd3; --ph3:#8fb0bb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081015; --glow:rgba(94,224,207,.10);
  --surface:#0f1b21; --surface2:#142830; --line:#213742;
  --fg:#e6f2f4; --muted:#8aa5ae;
  --accent:#5ee0cf; --accent-ink:#04211e; --accent-soft:rgba(94,224,207,.13);
  --in:#8fa0ff; --in-soft:rgba(143,160,255,.15);
  --good:#4fdc9a; --warn:#f2b84b; --bad:#ff7487;
  --imgbg:#f6fafb; --ph1:#dfeaee; --ph2:#b9ccd3; --ph3:#8fb0bb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(900px 420px at 85% -80px,var(--glow),transparent 70%);background-repeat:no-repeat;color:var(--fg);font:15px/1.5 var(--f-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;font-weight:500;text-wrap:balance}
.wrap{max-width:1100px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none}
.logo b{font-family:var(--f-d);font-weight:600;font-size:18px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}

.tr{display:flex;align-items:center;gap:8px}
.langwrap{position:relative}
.langbtn{padding:9px 13px;font-family:var(--f-m);font-weight:500;letter-spacing:.04em;border-radius:12px}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:150px;box-shadow:var(--shadow);z-index:70;display:flex;flex-direction:column}
.langmenu button{display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;white-space:nowrap;color:var(--fg)}
.langmenu button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.langmenu b{font-family:var(--f-m);width:2.2em;font-weight:500}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{padding:6px 12px;font-size:13px}
.seg.tabs button{padding:9px 6px}
.seg.tabs{position:sticky;top:calc(var(--toph,64px) + env(safe-area-inset-top,0px) + 6px);z-index:40;box-shadow:0 0 0 6px var(--bg)}
.pchk{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}.pchk input{width:20px;height:20px;accent-color:var(--accent,#5de0cf)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}

section.page{padding-top:20px;display:flex;flex-direction:column;gap:18px}

/* storefront */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.herotxt{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero.withlogo{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center}
.logocard{background:#fff;border-radius:28px;padding:10px;box-shadow:0 0 0 1px var(--line),0 18px 44px rgba(0,0,0,.22),0 0 60px var(--glow);width:100%;max-width:400px;justify-self:center}
.logocard img{display:block;width:100%;height:auto;border-radius:20px}
@media(min-width:720px){.hero.withlogo{grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:32px}.logocard{justify-self:start}}
.logomark{width:44px;height:44px;border-radius:13px;background:#fff;object-fit:contain;flex:none;box-shadow:0 0 0 1px var(--line)}
.hero h1{font-size:clamp(26px,5.5vw,40px);line-height:1.15;font-weight:600}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:13px;color:var(--muted)}
.chip b{color:var(--fg);font-weight:500}
a.chip,a.tel{text-decoration:none;color:inherit;cursor:pointer}
.tagpill{align-self:flex-start;padding:5px 14px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.calllbl{margin-top:10px;font-size:15px;font-weight:500}
.callbtn{display:inline-block;padding:12px 22px;border-radius:99px;background:#ff7a1a;color:#fff;font-weight:700;font-size:20px;text-decoration:none;box-shadow:0 8px 20px rgba(255,122,26,.35)}
.callrow{display:flex;flex-wrap:wrap;gap:10px}
.callbtn{display:inline-flex;align-items:center;gap:8px}
.callbtn.wa{background:#25d366;box-shadow:0 8px 20px rgba(37,211,102,.35)}
.callbtn:active{transform:scale(.97)}
a.chip:hover{border-color:var(--accent)}
a.tel b{color:var(--accent)}
.tools{display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search input{border:0;background:transparent;outline:0;padding:12px 0;flex:1;min-width:0}
.search:focus-within{border-color:var(--accent)}
.rowtools{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cols{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.cols .circ{display:flex;gap:6px}
.cols button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-d);font-size:16px;color:var(--fg)}
.cols button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:var(--gap,14px)}
.card{container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card.out{opacity:.72}
.newtile{border-style:dashed;background:var(--surface2);box-shadow:none;justify-content:center}
.newtile .ph{background:transparent;color:var(--accent)}
.newtile .ph svg{width:34%}
.newtile .cb{flex:0;align-items:center;text-align:center}
.newtile h3{color:var(--accent)}
.ph{position:relative;aspect-ratio:1/1;background:var(--imgbg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph svg{width:70%;height:auto}
.badge{position:absolute;top:clamp(4px,3.5cqw,10px);right:clamp(4px,3.5cqw,10px);padding:.18em .8em;border-radius:99px;font-size:clamp(8px,5.2cqw,12px);font-weight:600;line-height:1.4;background:#10392b;color:#58e0a2}
.badge.low{background:#3d2f0a;color:#f5c55a}
.badge.zero{background:#3a2229;color:#ff8c9b}
.badge.hide{left:clamp(4px,3.5cqw,10px);right:auto;background:#262b33;color:#b9c3d0}
.cb{padding:clamp(6px,5cqw,16px);display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.brand{font-family:var(--f-m);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-size:clamp(8px,5.4cqw,13px)}
.card h3{font-size:clamp(10px,7.2cqw,18px);line-height:1.25;overflow-wrap:anywhere}
.specs{color:var(--muted);font-size:clamp(8px,5.2cqw,13px)}
.price{font-family:var(--f-d);font-weight:600;font-size:clamp(11px,10.5cqw,24px);line-height:1.2;margin-top:clamp(3px,3cqw,8px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pb{font-family:var(--f-m);color:var(--muted);font-size:clamp(9px,6.2cqw,14px)}
.cf{margin-top:auto;padding-top:clamp(5px,4cqw,12px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:1px 8px;font-size:clamp(8px,5.6cqw,14px);color:var(--muted)}
.cf::before{content:"";}
.cf b{color:var(--fg);font-family:var(--f-d);font-size:clamp(9px,6.6cqw,17px)}
.cf .more{color:var(--accent);font-weight:500}
.cb .sep{border-top:1px dashed var(--line);margin-top:10px}

/* admin */
.pnav{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.pnav .nb{width:46px;border:1px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;font-size:20px;color:var(--fg)}
.pick{position:relative;flex:1;min-width:190px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.pick small{display:block;font-family:var(--f-m);color:var(--muted);font-size:13px}
.pick b{font-family:var(--f-d);font-size:19px;font-weight:600}
.pick input,.pick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.dot{width:12px;height:12px;border-radius:4px;background:var(--accent);flex:none}
.dot.in{background:var(--in)}
.kv{font-family:var(--f-d);font-weight:600;font-size:clamp(19px,5.2vw,32px);line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv small{font-size:.5em;font-weight:400;color:var(--muted)}
.ks{color:var(--muted);font-size:13px}
.ks .mono{font-size:13px}
.profit{border:1px dashed var(--line);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;align-items:flex-end;background:var(--surface2)}
.profit .kv{color:var(--good)}
.profit .neg{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel h2{font-size:19px}
.legend{display:flex;gap:14px;color:var(--muted);font-size:13px}
.legend span{display:flex;gap:6px;align-items:center}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:420px;height:auto}
.two{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.th{width:48px;height:48px;border-radius:12px;background:var(--imgbg);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:contain}
.th svg{width:80%}
.li .m{flex:1 1 150px;min-width:0;display:flex;flex-direction:column}
.li .m b{font-weight:500;overflow-wrap:anywhere}
.li .m span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.li .r{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;flex:none}
.li .r b{display:block;font-family:var(--f-d);font-weight:500}
.li .acts{display:flex;gap:6px;flex:none}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--fg);font-family:var(--f-d);font-weight:500;margin-bottom:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag.in{background:var(--in-soft);color:var(--in)}
.tag.warn{background:rgba(242,184,75,.16);color:var(--warn)}
.up{color:var(--good)}.dn{color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--fg);border-radius:14px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* modal + forms */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,10,14,.62);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media(min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:22px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--fg)}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.form input,.form select,.form textarea{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--fg);font-size:15px;width:100%;min-width:0}
.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:var(--accent)}
.form textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form h4{font-size:15px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.total{background:var(--surface2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total b{color:var(--fg);font-family:var(--f-d);font-weight:500}
.imgup{display:flex;gap:12px;align-items:center}
.imgup .th{width:84px;height:84px;border:1px solid var(--line)}
.imgbtns{display:flex;flex-wrap:wrap;gap:8px}
.form label.btn{flex-direction:row;color:var(--fg);font-size:14px;cursor:pointer;gap:8px}
.histbtn{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.histbtn b{display:block;font-family:var(--f-d);font-weight:500;font-size:17px}
.histbtn small{color:var(--muted);font-size:13px}
.histbtn:hover{border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:1em}
.detail-img{aspect-ratio:4/3;background:var(--imgbg);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px}
.detail-img img{width:100%;height:100%;object-fit:contain}
.detail-img svg{width:50%}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:200;font-size:14px;max-width:90vw}
.toast[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* QR Code encoder (byte mode, error correction M, versions 1-10) */
window.QR=(function(){
  const ECC_PER_BLOCK=[0,10,16,26,18,24,16,18,22,22,26];
  const NUM_BLOCKS=[0,1,1,1,2,2,4,4,4,5,5];
  const FORMAT_M=0;
  function rawModules(v){
    let r=(16*v+128)*v+64;
    if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}
    return r;
  }
  function dataCodewords(v){return Math.floor(rawModules(v)/8)-ECC_PER_BLOCK[v]*NUM_BLOCKS[v]}
  const EXP=new Array(512),LOG=new Array(256);
  (function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D}for(let i=255;i<512;i++)EXP[i]=EXP[i-255]})();
  const gmul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  function rsGen(d){let r=[1];for(let i=0;i<d;i++){const n=new Array(r.length+1).fill(0);for(let j=0;j<r.length;j++){n[j]^=r[j];n[j+1]^=gmul(r[j],EXP[i])}r=n}return r}
  function rsRem(data,gen){
    const d=gen.length-1,res=new Array(d).fill(0);
    for(const b of data){const f=b^res.shift();res.push(0);for(let i=0;i<d;i++)res[i]^=gmul(gen[i+1],f)}
    return res;
  }
  function utf8(s){return Array.from(new TextEncoder().encode(s))}
  function make(text){
    const bytes=utf8(text);
    let ver=1;
    for(;ver<=10;ver++){const cc=ver<10?8:16;if(4+cc+bytes.length*8<=dataCodewords(ver)*8)break}
    if(ver>10)throw new Error('too long');
    const cap=dataCodewords(ver)*8,bits=[];
    const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));
    while(bits.length%8)bits.push(0);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
    // blocks
    const nb=NUM_BLOCKS[ver],eccLen=ECC_PER_BLOCK[ver],raw=Math.floor(rawModules(ver)/8);
    const nShort=nb-raw%nb,shortLen=Math.floor(raw/nb);
    const gen=rsGen(eccLen),blocks=[];
    for(let i=0,k=0;i<nb;i++){
      const len=shortLen-eccLen+(i<nShort?0:1);
      const dat=data.slice(k,k+len);k+=len;
      const ecc=rsRem(dat,gen);
      if(i<nShort)dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all=[];
    for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-eccLen||j>=nShort)all.push(b[i])});
    // matrix
    const size=ver*4+17;
    const mod=Array.from({length:size},()=>new Array(size).fill(false));
    const fn=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{mod[y][x]=d;fn[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const pos=[];
    if(ver>1){const n=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(n*2-2))*2;pos.push(6);for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p)}
    for(let i=0;i<pos.length;i++)for(let j=0;j<pos.length;j++){
      if((i===0&&j===0)||(i===0&&j===pos.length-1)||(i===pos.length-1&&j===0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    const bit=(x,i)=>((x>>>i)&1)!==0;
    const drawFormat=m=>{
      const d=FORMAT_M<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
      const b=(d<<10|r)^0x5412;
      for(let i=0;i<=5;i++)setF(8,i,bit(b,i));
      setF(8,7,bit(b,6));setF(8,8,bit(b,7));setF(7,8,bit(b,8));
      for(let i=9;i<15;i++)setF(14-i,8,bit(b,i));
      for(let i=0;i<8;i++)setF(size-1-i,8,bit(b,i));
      for(let i=8;i<15;i++)setF(8,size-15+i,bit(b,i));
      setF(8,size-8,true);
    };
    drawFormat(0);
    if(ver>=7){
      let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);
      const b=ver<<12|r;
      for(let i=0;i<18;i++){const v=bit(b,i),a=size-11+i%3,c=Math.floor(i/3);setF(a,c,v);setF(c,a,v)}
    }
    // codewords
    let k=0;
    for(let right=size-1;right>=1;right-=2){
      if(right===6)right=5;
      for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){
        const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
        if(!fn[y][x]&&k<all.length*8){mod[y][x]=bit(all[k>>>3],7-(k&7));k++}
      }
    }
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!fn[y][x]&&maskFn[m](x,y))mod[y][x]=!mod[y][x]};
    const penalty=()=>{
      let p=0;
      const line=get=>{let run=1;for(let i=1;i<size;i++){if(get(i)===get(i-1)){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}};
      for(let y=0;y<size;y++)line(i=>mod[y][i]);
      for(let x=0;x<size;x++)line(i=>mod[i][x]);
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=mod[y][x];if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1])p+=3}
      const pat=[1,0,1,1,1,0,1,0,0,0,0],rev=pat.slice().reverse();
      const scan=get=>{for(let i=0;i+11<=size;i++){let a=true,b=true;for(let j=0;j<11;j++){const v=get(i+j)?1:0;if(v!==pat[j])a=false;if(v!==rev[j])b=false}if(a||b)p+=40}};
      for(let y=0;y<size;y++)scan(i=>mod[y][i]);
      for(let x=0;x<size;x++)scan(i=>mod[i][x]);
      let dark=0;for(const r of mod)for(const c of r)if(c)dark++;
      const tot=size*size;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;
      return p;
    };
    let best=0,bp=Infinity;
    for(let m=0;m<8;m++){apply(m);drawFormat(m);const p=penalty();if(p<bp){bp=p;best=m}apply(m)}
    apply(best);drawFormat(best);
    return mod;
  }
  return {make};
})();

/* ตัวเชื่อม Firebase  (ไม่ต้องแก้) */
(function(){
  const V='10.12.2',base='https://www.gstatic.com/firebasejs/'+V+'/';
  let fbp=null;
  function fb(){
    if(window.__FBMOCK)return Promise.resolve(window.__FBMOCK);
    if(!fbp)fbp=(async()=>{
      if(!window.FIREBASE_CONFIG)throw new Error('no config');
      const [app,fs,au]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
      const a=app.initializeApp(window.FIREBASE_CONFIG);
      return {app,fs,au,db:fs.getFirestore(a),auth:au.getAuth(a)};
    })();
    return fbp;
  }
  const clean=o=>JSON.parse(JSON.stringify(o));
  function docRef(f,path){
    const R=()=>f.fs.doc(f.db,path);
    return {
      id:path.split('/').pop(),
      onSnapshot:(cb,eb)=>f.fs.onSnapshot(R(),s=>{
        let d=s.exists()?s.data():null;
        if(path==='settings/main')d=Object.assign({},window.DEFAULT_SETTINGS,d||{});
        cb({exists:!!d,data:()=>d,id:s.id});
      },eb||(()=>{})),
      set:d=>f.fs.setDoc(R(),clean(d)),
      update:d=>f.fs.updateDoc(R(),clean(d)),
      delete:()=>f.fs.deleteDoc(R())
    };
  }
  function makeDb(f){
    return {
      doc:p=>docRef(f,p),
      collection:n=>({
        onSnapshot:(cb,eb)=>f.fs.onSnapshot(f.fs.collection(f.db,n),s=>cb({docs:s.docs,size:s.size}),eb||(()=>{})),
        doc:id=>docRef(f,n+'/'+(id||f.fs.doc(f.fs.collection(f.db,n)).id))
      })
    };
  }
  const authState=f=>new Promise(res=>{const u=f.au.onAuthStateChanged(f.auth,x=>{u();res(x)})});
  async function role(f,u){
    const owner=!!u&&u.uid===window.OWNER_UID;let staff=false,perms={all:owner,in:owner,out:owner};
    if(u&&!owner){try{const d=await f.fs.getDoc(f.fs.doc(f.db,'staff/'+u.uid));staff=d.exists();if(staff){const x=d.data()||{};perms=(x.all===undefined&&x.sum===undefined&&x.in===undefined&&x.out===undefined)||x.all===true?{all:true,in:true,out:true}:{all:!!x.sum,in:!!x.in,out:!!x.out}}}catch(e){}}
    return {owner,perms,canEdit:owner||(staff&&(perms.all||perms.in||perms.out))};
  }
  /* ออกจากระบบอัตโนมัติเมื่อไม่ได้ใช้งาน 30 นาที */
  const IDLE=30*60*1000,K='ac_last';let signed=false,lastWrite=0;
  const getLast=()=>{try{return +localStorage.getItem(K)||0}catch(e){return 0}};
  const setLast=()=>{try{localStorage.setItem(K,String(Date.now()))}catch(e){}};
  const touch=()=>{const n=Date.now();if(n-lastWrite>5000){lastWrite=n;setLast()}};
  ['pointerdown','keydown','touchstart','scroll','mousemove'].forEach(e=>addEventListener(e,touch,{passive:true,capture:true}));
  async function expire(){
    if(!signed)return;signed=false;
    try{await window.FBAUTH.logout()}catch(e){}
    try{sessionStorage.setItem('ac_idle','1')}catch(e){}
    location.reload();
  }
  function idleCheck(){if(signed&&Date.now()-getLast()>IDLE)expire()}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)idleCheck()});
  setInterval(idleCheck,30000);
  /* ติดตั้งแอป (PWA) */
  let dip=null;
  const instBtn=()=>document.getElementById('installBtn');
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=instBtn();if(b)b.hidden=false});
  addEventListener('appinstalled',()=>{dip=null;const b=instBtn();if(b)b.hidden=true});
  window.installApp=async()=>{if(!dip)return;try{dip.prompt();await dip.userChoice}catch(e){}dip=null;const b=instBtn();if(b)b.hidden=true};
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
  window.FBAUTH={
    async login(email,pw){
      const f=await fb();
      const c=await f.au.signInWithEmailAndPassword(f.auth,email,pw);
      setLast();
      const r=await role(f,c.user);
      if(!r.canEdit){await f.au.signOut(f.auth);const e=new Error('notowner');e.code='notowner';throw e}
    },
    async addStaff(email,pw,perm){perm=perm||{all:true,in:true,out:true};
      const f=await fb();
      const app2=f.app.initializeApp(window.FIREBASE_CONFIG,'sec'+Date.now());
      const a2=f.au.getAuth(app2);let uid;
      try{const c=await f.au.createUserWithEmailAndPassword(a2,email,pw);uid=c.user.uid}
      finally{try{await f.au.signOut(a2)}catch(e){}try{await f.app.deleteApp(app2)}catch(e){}}
      await f.fs.setDoc(f.fs.doc(f.db,'staff/'+uid),{email:email,all:false,sum:!!(perm.sum||perm.all),in:!!perm.in,out:!!perm.out,createdAt:new Date().toISOString()});
    },
    async changePassword(oldp,newp){const f=await fb();const u=f.auth.currentUser;if(!u){const e=new Error('nouser');e.code='nouser';throw e}const cred=f.au.EmailAuthProvider.credential(u.email,oldp);await f.au.reauthenticateWithCredential(u,cred);await f.au.updatePassword(u,newp)},
    async logout(){const f=await fb();await f.au.signOut(f.auth)}
  };
  const toDataUrl=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
  window.claude={use:async n=>{
    try{
      if(n==='db')return makeDb(await fb());
      if(n==='user'){const f=await fb();const u=await authState(f);const r=await role(f,u);signed=!!r.canEdit;if(signed){idleCheck();if(signed)setLast()}return {canEdit:()=>r.canEdit,isOwner:()=>r.owner,perms:()=>r.perms}}
      if(n==='assets')return {upload:async blob=>{const d=await toDataUrl(blob);return {id:d,url:d}}};
      if(n==='downloads')return {save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return {status:'saved'}}};
    }catch(e){return null}
    return null;
  }};
})();

function qrUrl(){return location.origin+location.pathname.replace(/index\.html$/,'')}
function qrCanvas(size,label){
  const m=window.QR.make(qrUrl()),n=m.length,q=4,cell=Math.max(2,Math.floor(size/(n+q*2))),px=cell*(n+q*2);
  const lh=label?Math.round(px*0.3):0,c=document.createElement('canvas');c.width=px;c.height=px+lh;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(m[r][k])x.fillRect((k+q)*cell,(r+q)*cell,cell,cell);
  if(label){
    x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';
    x.font='600 '+Math.round(px*0.075)+'px Kanit,"IBM Plex Sans Thai","Noto Sans Lao",sans-serif';
    x.fillText(S.settings.shopName||'',px/2,px-cell*q*0.35+lh*0.28);
    x.fillStyle='#444';x.font='400 '+Math.round(px*0.05)+'px Kanit,"IBM Plex Sans Thai","Noto Sans Lao",sans-serif';
    x.fillText(tr('สแกนดูสินค้าและราคา'),px/2,px-cell*q*0.35+lh*0.68);
  }
  return c;
}
function drawQR(){
  const cv=$('#qrCv');if(!cv)return;
  try{const c=qrCanvas(520,false);cv.width=c.width;cv.height=c.height;cv.getContext('2d').drawImage(c,0,0);$('#qrUrl').textContent=qrUrl()}
  catch(e){$('#qrUrl').textContent='QR error'}
}

function permOf(x){const leg=x.all===undefined&&x.sum===undefined&&x.in===undefined&&x.out===undefined;const full=leg||x.all===true;return {sum:full||x.sum===true,in:full||x.in===true,out:full||x.out===true}}
function permBoxes(x){const p=permOf(x);return [['sum','สรุป'],['in','รับเข้า'],['out','ขายออก']].map(k=>'<label class="pchk"><input type="checkbox" class="staffperm" data-id="'+esc(x.id)+'" data-k="'+k[0]+'"'+(p[k[0]]?' checked':'')+'> '+tr(k[1])+'</label>').join('')}
function joinSales(){S.sales=S.salesRaw.map(x=>{const c=S.salecosts[x.id];return c?Object.assign({},x,{costKip:c.costKip,costBaht:c.costBaht}):x})}
async function fixSales(){
  if(!S.isOwner||S.fixing||!S.loadedS||!S.loadedC||!S.loadedP)return;
  const todo=S.salesRaw.filter(x=>x.costPending||x.costKip!==undefined);
  if(!todo.length)return;
  S.fixing=true;
  try{
    for(const x of todo){
      const {id,costKip,costBaht,costPending,...rest}=x;
      let ck=costKip,cb=costBaht;
      if(S.salecosts[id]){ck=S.salecosts[id].costKip;cb=S.salecosts[id].costBaht}
      else if(costPending||ck===undefined){const ac=avgCost(x.productId);ck=Math.round(ac.kip);cb=Math.round(ac.baht)}
      await S.db.doc('salecosts/'+id).set({costKip:ck||0,costBaht:cb||0});
      await S.db.doc('sales/'+id).set(rest);
    }
  }catch(e){}
  S.fixing=false;
}

async function backup(k){

  const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const clean=r=>{const o=Object.assign({},r);return o};
  let name,data;
  if(k==='json'){name='jp-home-air-backup-'+ds+'.json';data=JSON.stringify({exportedAt:d.toISOString(),settings:S.settings,products:S.products,purchases:S.purchases,sales:S.sales},null,1)}
  else{
    const rows=(S[k]||[]).map(clean);
    const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
    const q=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    if(!rows.length){toast('—');return}
    name='jp-home-air-'+k+'-'+ds+'.csv';data='\ufeff'+[keys.join(',')].concat(rows.map(r=>keys.map(c=>q(r[c])).join(','))).join('\r\n')
  }
  try{await dl.save({filename:name,data});toast(tr('บันทึกไฟล์แล้ว'))}catch(e){if(!e||e.code!=='declined')toast(tr('ดาวน์โหลดไม่ได้ในหน้านี้'))}
}

  const bK=buys.reduce((t,p)=>t+p.qty*p.costKip,0),bB=buys.reduce((t,p)=>t+p.qty*(p.costBaht||0),0);
  const prof=sales.reduce((t,s)=>t+s.qty*(s.priceKip-(s.costKip||0)),0);
  const margin=sK?prof/sK*100:0;
  const stockCost=S.products.reduce((t,p)=>t+(p.stock||0)*avgCost(p.id).kip,0);
  const stockSell=S.products.reduce((t,p)=>t+(p.stock||0)*(p.priceKip||0),0);

function niceMax(v){if(v<=0)return 1e6;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e}
function compact(n){if(n>=1e6){const v=n/1e6;return (v%1?v.toFixed(1):v.toFixed(0))+'M'}if(n>=1e3)return Math.round(n/1e3)+'k';return String(Math.round(n))}
function chartPanel(){
  const m=S.mode==='month';const pts=[];
  if(m){let [y,mo]=S.period.split('-').map(Number);for(let i=5;i>=0;i--){let yy=y,mm=mo-i;while(mm<1){mm+=12;yy--}pts.push({k:monthKey(yy,mm),l:TS[mm-1],cur:i===0})}}
  else{const y=+S.year;for(let i=1;i<=12;i++)pts.push({k:monthKey(y,i),l:TS[i-1],cur:false})}
  pts.forEach(p=>Object.assign(p,sumMonth(p.k)));
  const mx=niceMax(Math.max(...pts.map(p=>Math.max(p.sales,p.buy))));
  const W=600,H=230,L=46,R=8,T=14,B=30,cw=W-L-R,ch=H-T-B,gw=cw/pts.length,bw=Math.min(22,gw*.32);
  const y=v=>T+ch-(v/mx)*ch;
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1" '+(i?'stroke-dasharray="3 4"':'')+'/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+compact(v)+'</text>'}
  pts.forEach((p,i)=>{
    const cx=L+gw*i+gw/2,op=(m&&!p.cur)?.55:1;
    const hs=(p.sales/mx)*ch,hb=(p.buy/mx)*ch;
    g+='<g opacity="'+op+'"><title>'+p.l+' · '+tr('ขาย')+' '+kip(p.sales)+' · '+tr('ซื้อเข้า')+' '+kip(p.buy)+'</title>'+
     '<rect x="'+(cx-bw-1.5)+'" y="'+(T+ch-hs)+'" width="'+bw+'" height="'+Math.max(hs,p.sales?2:0)+'" rx="4" fill="var(--accent)"/>'+
     '<rect x="'+(cx+1.5)+'" y="'+(T+ch-hb)+'" width="'+bw+'" height="'+Math.max(hb,p.buy?2:0)+'" rx="4" fill="var(--in)"/></g>'+
     '<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="'+(p.cur?'var(--fg)':'var(--muted)')+'" font-weight="'+(p.cur?600:400)+'">'+p.l+'</text>';
  });
  return '<div class="panel"><header><h2>'+(m?'6 '+tr('เดือนล่าสุด')+'':''+tr('รายเดือนในปี')+' '+S.year)+'</h2><div class="legend"><span><i class="dot"></i>'+tr('ยอดขาย')+'</span><span><i class="dot in"></i>'+tr('ซื้อเข้า')+'</span></div></header><div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+tr('กราฟยอดขายและยอดซื้อเข้า หน่วยกีบ')+'">'+g+'</svg></div></div>';
}

function drawHist(init){
  const h=S.hist;if(!h||!$('#hBody'))return;
  const isIn=h.kind==='in',rows=isIn?S.purchases:S.sales;
  const months=[...new Set(rows.map(r=>(r.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const sel=$('#hMonth');
  if(init||sel.options.length!==months.length+1){
    sel.innerHTML='<option value="all">'+tr('ทั้งหมด')+'</option>'+months.map(m=>'<option value="'+m+'">'+TM[+m.slice(5)-1]+' '+m.slice(0,4)+'</option>').join('');
    sel.value=months.includes(h.month)?h.month:'all';h.month=sel.value;
  }
  let list=rows.filter(r=>h.month==='all'||(r.date||'').startsWith(h.month));
  const q=h.q.trim().toLowerCase();
  if(q)list=list.filter(r=>{const p=prod(r.productId)||{};return [p.brand,p.name,r.customer,r.note].join(' ').toLowerCase().includes(q)});
  list.sort(histSort);
  const tq=list.reduce((t,r)=>t+r.qty,0);
  const tk=list.reduce((t,r)=>t+r.qty*(isIn?r.costKip:r.priceKip),0);
  const tb=list.reduce((t,r)=>t+r.qty*((isIn?r.costBaht:r.priceBaht)||0),0);
  const pf=isIn?0:list.reduce((t,r)=>t+r.qty*(r.priceKip-(r.costKip||0)),0);
  $('#hBody').innerHTML='<div class="total" style="margin:14px 0 6px"><span>'+list.length+' '+tr('รายการ')+' · '+nf(tq)+' '+tr('เครื่อง')+'</span><b>'+kip(tk)+' · '+baht(tb)+'</b></div>'+(isIn||!S.perm.all?'':'<div class="note" style="margin-bottom:6px">'+tr('กำไรขั้นต้นรวม')+' <b class="'+(pf<0?'dn':'up')+'">'+(pf<0?'−':'')+kip(Math.abs(pf))+'</b></div>')+
    (list.length?'<div class="list">'+list.map(isIn?purRow:saleRow).join('')+'</div>':'<div class="empty"><b>'+tr('ไม่พบรายการ')+'</b>'+tr('ลองเปลี่ยนเดือนหรือคำค้นหา')+'</div>');
}

function bindImage(f){
  const pick=async(inp)=>{
    const file=inp.files&&inp.files[0];if(!file)return;
    const st=$('#imgSt');st.textContent=''+tr('กำลังอัปโหลด')+'…';uploading=true;
    try{
      const as=await claude.use('assets');if(!as)throw new Error('no');
      const bmp=await createImageBitmap(file);const r=Math.min(1,640/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas');c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
      const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.78));
      const up=await as.upload(blob,{type:'image/jpeg'});
      f.elements.imageId.value=up.id;$('#imgPrev').innerHTML='<img alt="" src="'+esc(up.url)+'">';st.textContent=''+tr('อัปโหลดแล้ว')+'';
    }catch(e){st.textContent=''+tr('อัปโหลดไม่สำเร็จ ลองรูปอื่นหรือลองใหม่')+''}
    uploading=false;inp.value='';
  };
  ['#imgFile','#imgCam'].forEach(q=>{const el=$(q);if(el)el.addEventListener('change',()=>pick(el))});
  const rm=$('#imgDel');if(rm)rm.addEventListener('click',()=>{f.elements.imageId.value='';$('#imgPrev').innerHTML=acSvg;$('#imgSt').textContent=''+tr('ลบรูปแล้ว จะมีผลเมื่อกดบันทึก')+''});
}

async function delPur(id){
  const r=S.purchases.find(x=>x.id===id);if(!r)return;const p=prod(r.productId);
  try{await S.db.doc('purchases/'+id).delete();if(p)await S.db.doc('products/'+p.id).update({stock:Math.max(0,(p.stock||0)-r.qty)});toast(''+tr('ลบรายการรับเข้าแล้ว')+'')}catch(e){toast(''+tr('ลบไม่สำเร็จ')+'')}
}
async function delSale(id){
  const r=S.sales.find(x=>x.id===id);if(!r)return;const p=prod(r.productId);
  try{await S.db.doc('sales/'+id).delete();try{await S.db.doc('salecosts/'+id).delete()}catch(e){}if(p)await S.db.doc('products/'+p.id).update({stock:(p.stock||0)+r.qty});toast(''+tr('ลบรายการขายแล้ว')+'')}catch(e){toast(''+tr('ลบไม่สำเร็จ')+'')}
}
async function recalc(){
  try{let n=0;for(const p of S.products){const inn=S.purchases.filter(r=>r.productId===p.id).reduce((t,r)=>t+r.qty,0),out=S.sales.filter(r=>r.productId===p.id).reduce((t,r)=>t+r.qty,0);const st=Math.max(0,inn-out);if(st!==(p.stock||0)){await S.db.doc('products/'+p.id).update({stock:st});n++}}toast(n?''+tr('ปรับสต็อก')+' '+n+' '+tr('รุ่น')+'':''+tr('สต็อกตรงกับประวัติแล้ว')+'')}catch(e){toast(''+tr('คำนวณไม่สำเร็จ')+'')}
}

/* ---------- events ---------- */
function shiftPeriod(d){
  if(S.mode==='month'){let [y,m]=S.period.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}S.period=monthKey(y,m)}
  else S.year=String(+S.year+d);
}
document.addEventListener('click',e=>{
  {const lm=$('#langMenu');if(lm&&!lm.hidden&&!e.target.closest('.langwrap'))lm.hidden=true}
  if(e.target.id==='modal'){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'close':closeModal();break;
    case 'lang':{const lm=$('#langMenu');lm.hidden=!lm.hidden;if(!lm.hidden){lm.style.left='0';lm.style.right='auto';const br=$('#langBtn').getBoundingClientRect();if(br.left+lm.offsetWidth>window.innerWidth-8){lm.style.left='auto';lm.style.right='0'}}break}
    case 'setlang':S.lang=b.dataset.l;lsSet('ac_lang',S.lang);$('#langMenu').hidden=true;render();break;
    case 'view':S.view=b.dataset.v;history.replaceState(null,'','#'+S.view);render();window.scrollTo(0,0);break;
    case 'tab':S.tab=b.dataset.t;render();break;
    case 'mode':S.mode=b.dataset.m;render();break;
    case 'prev':shiftPeriod(-1);render();break;
    case 'next':shiftPeriod(1);render();break;
    case 'now':S.period=today().slice(0,7);S.year=today().slice(0,4);render();break;
    case 'brand':S.brand=b.dataset.b;render();break;
    case 'cols':S.cols=+b.dataset.n;lsSet('ac_cols',String(S.cols));render();break;
    case 'open':openDetail(id);break;
    case 'copy':try{navigator.clipboard.writeText(b.dataset.t).then(()=>toast(''+tr('คัดลอกแล้ว')+''),()=>toast(''+tr('คัดลอกไม่ได้ ลองเลือกข้อความเอง')+''))}catch(x){toast(''+tr('คัดลอกไม่ได้ ลองเลือกข้อความเอง')+'')}break;
    case 'newpur':case 'pickpur':purForm(id);break;
    case 'picksale':{const pp=prod(id);if(pp&&(pp.stock||0)>0)saleForm(id);else toast(''+tr('สินค้าหมดสต็อก รับเข้าก่อนจึงจะขายได้')+'');break}
    case 'newsale':saleForm();break;
    case 'delpur':armed(b,()=>delPur(id));break;
    case 'delsale':armed(b,()=>delSale(id));break;
    case 'delprod':armed(b,async()=>{try{await S.db.doc('products/'+id).delete();closeModal();toast(''+tr('ลบสินค้าแล้ว')+'')}catch(x){toast(''+tr('ลบไม่สำเร็จ')+'')}});break;
    case 'recalc':recalc();break;
    case 'lock':S.unlocked=false;try{sessionStorage.removeItem('ac_unlock')}catch(x){}S.view='shop';history.replaceState(null,'','#shop');render();window.scrollTo(0,0);break;
    case 'bk':backup(b.dataset.k);break;
    case 'login':openModal(tr('เข้าสู่ระบบหลังบ้าน'),'<form class="form" id="fLogin" autocomplete="on"><label>'+tr('อีเมล')+'<input name="email" type="email" autocomplete="username" required></label><label>'+tr('รหัสผ่าน')+'<input name="pw" type="password" autocomplete="current-password" required></label><div class="err" id="loginErr"></div><button class="btn primary" type="submit">'+tr('เข้าสู่ระบบ')+'</button></form>');break;
    case 'logout':(async()=>{try{await window.FBAUTH.logout()}catch(x){}location.hash='';location.reload()})();break;
    case 'seed':seedOld();break;
    case 'install':if(window.installApp)window.installApp();break;
    case 'qrsave':qrSave();break;
    case 'delstaff':armed(b,async()=>{try{await S.db.doc('staff/'+b.dataset.id).delete();toast(tr('ลบพนักงานแล้ว'))}catch(x){toast(tr('ลบไม่สำเร็จ'))}});break;
    case 'reload':location.reload();break;
    case 'hk':S.hist.kind=b.dataset.k;S.hist.month='all';render();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{if(e.target.id==='qIn'){S.q=e.target.value;drawGrid()}else if(e.target.id==='hQ'&&S.hist){S.hist.q=e.target.value;drawHist()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sortSel'){S.sort=t.value;drawGrid()}
  else if(t.id==='pm'&&t.value){S.period=t.value;render()}
  else if(t.id==='py'){S.year=t.value;render()}
  else if(t.id==='alangSel'){S.alang=t.value;lsSet('ac_alang',t.value);render()}
  else if(t.id==='hMonth'&&S.hist){S.hist.month=t.value;drawHist()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='fPur')submitPur(f);else if(f.id==='fSale')submitSale(f);else if(f.id==='fSet')submitSet(f);else if(f.id==='fLock')submitLock(f);else if(f.id==='fLogin')submitLogin(f);else if(f.id==='fStaff')submitStaff(f);else if(f.id==='fPin')submitPin(f);
});
window.addEventListener('hashchange',()=>{S.view=location.hash==='#admin'?'admin':'shop';render()});

/* ---------- boot ---------- */
async function boot(){
  S.lang=lsGet('ac_lang')||null;S.alang=lsGet('ac_alang')||'th';
  S.view=location.hash==='#admin'?'admin':'shop';
  render();
  const slow=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  let db=null,user=null;
  try{db=await window.claude.use('db')}catch(e){}
  try{user=await window.claude.use('user')}catch(e){}
  if(!db){S.dbOff=true;clearTimeout(slow);render();return}
  S.db=db;
  try{S.canEdit=!!(user&&user.canEdit&&user.canEdit())}catch(e){}
  try{S.isOwner=!!(user&&user.isOwner&&user.isOwner())}catch(e){}
  try{S.perm=user&&user.perms?user.perms():{all:S.isOwner,in:S.isOwner,out:S.isOwner}}catch(e){}
  const err=()=>{S.dbOff=true;render()};
  db.collection('products').onSnapshot(s=>{S.products=snapArr(s);S.loaded=true;S.dbOff=false;clearTimeout(slow);render()},err);
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():{};try{if(S.settings.pinHash&&sessionStorage.getItem('ac_unlock')===S.settings.pinHash)S.unlocked=true}catch(e){}render()},()=>{});
  if(S.canEdit){
    if(S.perm.in||S.perm.all)db.collection('purchases').onSnapshot(s=>{S.purchases=snapArr(s);S.loadedP=true;render();fixSales()},()=>{});
    if(S.perm.out||S.perm.all)db.collection('sales').onSnapshot(s=>{S.salesRaw=snapArr(s);S.loadedS=true;joinSales();render();fixSales()},()=>{});
    if(S.perm.all)db.collection('salecosts').onSnapshot(s=>{S.salecosts={};s.docs.forEach(d=>{S.salecosts[d.id]=d.data()});S.loadedC=true;joinSales();render();fixSales()},()=>{});
    if(S.isOwner)db.collection('staff').onSnapshot(s=>{S.staff=snapArr(s);render()},()=>{});
  }
  render();
  try{if(sessionStorage.getItem('ac_idle')){sessionStorage.removeItem('ac_idle');toast(tr('ออกจากระบบอัตโนมัติ เพราะไม่ได้ใช้งานนาน 30 นาที'))}}catch(e){}
}
document.addEventListener('change',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('staffperm')){const row=t.closest('.pbox');const g=k=>row.querySelector('[data-k='+k+']').checked;S.db.doc('staff/'+t.dataset.id).update({all:false,sum:g('sum'),in:g('in'),out:g('out')}).then(()=>toast(tr('เปลี่ยนสิทธิ์แล้ว'))).catch(()=>toast(tr('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง')))}});
const hh=()=>{const h=document.querySelector('.top');if(h)document.documentElement.style.setProperty('--toph',h.offsetHeight+'px')};hh();addEventListener('resize',hh);setTimeout(hh,500);setTimeout(hh,1500);
boot();
})();
</script>
</body></html>
